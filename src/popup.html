<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTM Debugger</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <!-- header section: logo, title, and domain of the current page -->
    <header class="header">
        <div class="brand">
            <img src="icon.png" alt="UTM Debugger Logo" width="32" height="32">
        </div>
        <div class="title">
            <h1>UTM Debugger</h1>
            <p class="domain">current-running-url.com</p>
        </div>
    </header>

    <!-- navigation section: buttons to switch between tabs -->
    <nav class="navigation">
        <button class="nav-button active" data-target="status" type="button">Status</button>
        <button class="nav-button" data-target="errors" type="button">Errors</button>
        <button class="nav-button" data-target="blocking" type="button">Blocking</button>
        <button class="nav-button" data-target="settings" type="button">Settings</button>
    </nav>

    <!-- Tracker Status Tab (Main Tab): displays the content of the selected tab -->
    <main class="content">
        <section id="status" class="page">
            <h2>Tracker Status</h2>
            <div id="utm-parameters"></div>

            <p class="description">Tracker health on current page</p>

            <div class="legend">
                <span><i class="dot green"></i>Healthy</span>
                <span><i class="dot red"></i>Error</span>
                <span><i class="dot grey"></i>Not Detected</span>
            </div>

        </section>

        <!-- Errors Tab: displays the content of the selected tab -->
        <section id="errors" class="page" style="display: none;">
            <h2>Error Log</h2>
            <p class="description">Recent Tracking errors</p>
            <div id="error-messages"></div>
        </section>

        <!-- Blocking Tab: displays the content of the selected tab -->
        <section id="blocking" class="page" style="display: none;">
            <h2>Tracker Blocking</h2>
            <p class="description">Choose which trackers to block</p>
            <div id="blocking-content"></div>
        </section>

        <!-- Settings Tab: displays the content of the selected tab -->
        <section id="settings" class="page" style="display: none;">
            <h2>Settings</h2>
            <p class="description">Configure automatic activation</p>
            <div id="settings-content"></div>
        </section>
    </main>

    <!-- footer section: DATA FYI/Version info -->
    <footer class="footer">
        <span>Data is stored locally</span>
        <span>UTM Debugger &copy; 2024</span>
        <span>v1.0</span>
    </footer>
    <!-- JavaScript for handling popup functionality -->
    <script src="popup.js"></script>
</body>
</html>
